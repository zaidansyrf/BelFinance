expose_php = Off
memory_limit = 256M

; Foto menu dibatasi 2 MB oleh validasi aplikasi; batas ini hanya pagar luarnya
upload_max_filesize = 10M
post_max_size = 12M

; Permintaan AI bisa lama: batas waktu Vikey 60 detik, dengan coba-ulang
max_execution_time = 180

opcache.enable = 1
opcache.memory_consumption = 128
opcache.interned_strings_buffer = 16
opcache.max_accelerated_files = 20000
; Kode tidak berubah selama container hidup
opcache.validate_timestamps = 0
